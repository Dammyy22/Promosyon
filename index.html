<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PromoTekstil — Kurumsal Promosyon Ürünleri | Üreticiden Direkt</title>

<meta name="description" content="16 yıllık tekstil üreticisinden kurumsal promosyon ürünleri.">
<meta property="og:title" content="PromoTekstil">
<meta property="og:description" content="Kurumsal promosyon ürünleri üretici fiyatıyla">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
body{margin:0;font-family:Inter,sans-serif;background:#fff;color:#1A1A2E}
h1,h2,h3{font-family:Montserrat,sans-serif}

/* HERO */
.hero{background:#1B2D4F;color:#fff;padding:80px 5%;text-align:center}
.hero h1{font-size:42px}
.hero p{opacity:.8;max-width:600px;margin:20px auto}

/* FORM */
.form-section{background:#1B2D4F;padding:80px 5%}
.form-box{max-width:700px;margin:auto;background:rgba(255,255,255,0.08);padding:30px;border-radius:12px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

input,select,textarea{
width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);
background:rgba(255,255,255,0.1);color:#fff
}

textarea{grid-column:1/-1;height:120px}

button{
width:100%;padding:14px;border:none;border-radius:8px;
background:#E8610A;color:#fff;font-weight:700;cursor:pointer;margin-top:10px
}

button:hover{background:#cf5208}

.form-note{font-size:12px;color:rgba(255,255,255,0.6);margin-top:10px;text-align:center}
</style>

</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>PromoTekstil</h1>
  <p>Kurumsal promosyon ürünleri üretici fiyatıyla. Tişört, kalem, termos ve daha fazlası.</p>
</section>

<!-- FORM -->
<section class="form-section">

  <div class="form-box">

    <!-- 🔥 FORM BAŞLANGIÇ -->
    <form action="https://formsubmit.co/damla.irak@outlook.com" method="POST">

      <div class="form-grid">

        <input type="text" name="name" placeholder="Ad Soyad" required>
        <input type="text" name="company" placeholder="Firma">

        <input type="tel" name="phone" placeholder="Telefon" required>
        <input type="email" name="email" placeholder="E-posta" required>

        <select name="category" required>
          <option disabled selected>Ürün Kategorisi</option>
          <option>Tekstil</option>
          <option>Promosyon</option>
          <option>Özel Tasarım</option>
        </select>

        <input type="number" name="quantity" placeholder="Adet">

        <textarea name="message" placeholder="Mesajınız" required></textarea>

      </div>

      <!-- FORMSETTINGS -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="Yeni Teklif Geldi">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="https://dammyy22.github.io/Promosyon/">

      <!-- SUBMIT -->
      <button type="submit">Ücretsiz Teklif Gönder</button>

      <div class="form-note">
        Bilgileriniz e-posta ile iletilir. Spam yok.
      </div>

    </form>
    <!-- 🔥 FORM BİTİŞ -->

  </div>

</section>

</body>
</html>
