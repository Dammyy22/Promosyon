<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromoTekstil — Kurumsal Promosyon Ürünleri | Üreticiden Direkt</title>

<meta name="description" content="16 yıllık tekstil üreticisinden kurumsal promosyon ürünleri. Tişört, termos, kalem ve daha fazlası. Toplu siparişlerde üretici fiyatı. Ücretsiz teklif alın.">
<meta name="keywords" content="kurumsal promosyon ürünleri, toplu tişört baskı, logolu promosyon, kurumsal hediye, tekstil promosyon, toplu kalem siparişi">

<meta property="og:title" content="PromoTekstil — Kurumsal Promosyon Ürünleri">
<meta property="og:description" content="16 yıllık tekstil üreticisinden kurumsal promosyon ürünleri. Üreticiden direkt fiyat.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;color:#1A1A2E;background:#fff}
h1,h2,h3,h4{font-family:'Montserrat',sans-serif}

/* NAV */
nav{background:#1B2D4F;padding:0 5%;display:flex;align-items:center;justify-content:space-between;height:68px;position:sticky;top:0;z-index:100}
.logo{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;color:#fff;letter-spacing:-0.5px;text-decoration:none}
.logo span{color:#E8610A}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{color:rgba(255,255,255,0.82);text-decoration:none;font-size:14px;font-weight:500}
.nav-right{display:flex;align-items:center;gap:20px}
.nav-phone{color:#fff;font-size:14px;text-decoration:none}
.nav-cta{background:#E8610A;color:#fff;border:none;padding:10px 22px;border-radius:6px;cursor:pointer}

/* HERO */
.hero{background:linear-gradient(135deg,#1B2D4F 0%,#243d6b 100%);padding:80px 5%;display:flex;gap:60px;min-height:520px}
.hero-text{flex:1}
.hero h1{font-size:44px;color:#fff}
.hero p{color:rgba(255,255,255,0.75);margin-top:15px}
.btn-primary{background:#E8610A;color:#fff;border:none;padding:14px 30px;border-radius:7px;cursor:pointer}
.btn-outline{background:transparent;color:#fff;border:1px solid #fff;padding:14px 28px;border-radius:7px}

/* FORM */
.form-bg{background:#1B2D4F;padding:80px 5%}
.teklif-form{background:rgba(255,255,255,0.07);padding:36px;border-radius:16px}

/* GRID */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input,select,textarea{
width:100%;padding:12px;border-radius:8px;
border:1px solid rgba(255,255,255,0.2);
background:rgba(255,255,255,0.1);color:#fff
}

.submit-btn{
width:100%;margin-top:15px;
background:#E8610A;color:#fff;
padding:15px;border:none;border-radius:8px;
cursor:pointer
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="#" class="logo">Promo<span>Tekstil</span></a>
  <ul class="nav-links">
    <li><a href="#urunler">Ürünler</a></li>
    <li><a href="#neden-biz">Hakkımızda</a></li>
    <li><a href="#teklif">İletişim</a></li>
  </ul>
  <div class="nav-right">
    <a href="tel:02120000000" class="nav-phone">0212 000 00 00</a>
    <button class="nav-cta" onclick="document.getElementById('teklif').scrollIntoView({behavior:'smooth'})">Teklif Al</button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    <h1>Kurumsal Promosyonda Üretici Avantajı</h1>
    <p>Fabrikadan direkt promosyon ürünleri</p>
    <button class="btn-primary" onclick="document.getElementById('teklif').scrollIntoView({behavior:'smooth'})">Teklif Al</button>
    <button class="btn-outline">Katalog</button>
  </div>
</section>

<!-- FORM -->
<section class="form-bg" id="teklif">

  <h2 style="color:#fff;text-align:center;margin-bottom:20px">
    Ücretsiz Teklif Al
  </h2>

  <!-- 🔥 ÇALIŞAN FORM -->
  <form class="teklif-form"
        action="https://formsubmit.co/damla.irak@outlook.com"
        method="POST">

    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="Yeni Teklif Talebi">

    <div class="form-grid">
      <input type="text" name="name" placeholder="Ad Soyad" required>
      <input type="text" name="company" placeholder="Firma">
      <input type="tel" name="phone" placeholder="Telefon" required>
      <input type="email" name="email" placeholder="E-posta" required>

      <select name="category">
        <option>Tekstil</option>
        <option>Promosyon</option>
        <option>Özel Tasarım</option>
      </select>

      <input type="number" name="quantity" placeholder="Adet">
    </div>

    <textarea name="message" placeholder="Not"></textarea>

    <button type="submit" class="submit-btn">
      Gönder
    </button>

  </form>

</section>

</body>
</html>
