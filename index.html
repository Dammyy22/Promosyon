<form class="teklif-form" action="https://formsubmit.co/damla.irak@outlook.com" method="POST">

  <div class="form-grid">
    <input type="text" placeholder="Adınız Soyadınız" name="name" required>
    <input type="text" placeholder="Firma Adı" name="company">
    <input type="tel" placeholder="Telefon Numarası" name="phone" required>
    <input type="email" placeholder="E-posta Adresi" name="email" required>

    <select name="category" required>
      <option value="" disabled selected>Ürün Kategorisi</option>
      <option value="tekstil">Tekstil Ürünleri</option>
      <option value="promosyon">Promosyon Ürünleri</option>
      <option value="ozel">Özel Tasarım</option>
      <option value="karma">Karma Sipariş</option>
    </select>

    <input type="number" placeholder="Tahmini Adet" name="quantity" min="1">
  </div>

  <textarea placeholder="Notunuz veya özel istekleriniz..." name="message" required></textarea>

  <!-- 🔒 spam koruma -->
  <input type="hidden" name="_captcha" value="false">

  <!-- 🔁 siteye dönüş -->
  <input type="hidden" name="_next" value="https://dammyy22.github.io/Promosyon/">

  <!-- 📩 mail subject -->
  <input type="hidden" name="_subject" value="Yeni Promosyon Teklifi Geldi!">

  <button type="submit" class="submit-btn">
    Ücretsiz Teklif İste <i class="ti ti-send" aria-hidden="true"></i>
  </button>

  <div class="form-note">
    <i class="ti ti-lock" style="font-size:14px" aria-hidden="true"></i>
    Bilgileriniz güvende. Spam göndermiyoruz.
  </div>

</form>
